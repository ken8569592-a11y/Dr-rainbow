if(s.view==='game'){board();if(s.question)showQuestion();else if(s.pending)showPending();return}if(s.view==='result')results();}
function start(){let name=$('name').value.trim();if(!name){$('name').focus();return}let role=s.role;s=fresh();s.name=name;s.role=role;s.view='lesson';render()}function resume(){try{let x=JSON.parse(localStorage.getItem('dr-rainbow-v1'));if(!x||!x.name){alert('目前沒有可恢復的進度。');return}validate(x);s=x;render()}catch(e){alert('無法恢復進度，請匯入進度檔。')}}
function beginQuiz(){s.attempts[s.stage]++;s.quiz={ids:shuffle(BANK[s.stage]).slice(0,5).map(q=>q.id),index:0,order:shuffle([0,1,2]),selected:null,answers:[]};s.view='quiz';render()}function answerQuiz(){let q=s.quiz;s.records.push({type:'quiz',stage:s.stage,attempt:s.attempts[s.stage],id:q.ids[q.index],option:q.selected,correct:q.selected===0,at:new Date().toISOString()});q.answers.push({id:q.ids[q.index],option:q.selected});if(++q.index===5){s.passed[s.stage]=q.answers.filter(a=>a.option===0).length>=4;s.view='quizResult'}else{q.order=shuffle([0,1,2]);q.selected=null}tone(600);render()}
const COORDS=[];for(let c=1;c<=6;c++)COORDS.push([1,c]);for(let r=2;r<=6;r++)COORDS.push([r,6]);for(let c=5;c>=1;c--)COORDS.push([6,c]);for(let r=5;r>=2;r--)COORDS.push([r,1]);const TYPE=['start','p','c','chance','p','item','c','p','fate','c','p','chance','c','item','p','c','chance','p','fate','c'];
function board(){let state=s.pending?'等待確認':s.question?'情境任務':'輪到你擲骰';$('main').innerHTML=`<span class="pill">第 ${s.stage+1} 階段 · ${TOPICS[s.stage]}</span><div style="display:flex;justify-content:space-between;align-items:center"><h1>彩虹棋盤</h1><button onclick="pauseGame()">暫停</button></div><div class="board">${COORDS.map(([r,c],i)=>`<div class="cell ${TYPE[i]==='c'?'other':['chance','fate'].includes(TYPE[i])?'event':TYPE[i]==='item'?'item':''}" style="grid-row:${r};grid-column:${c}"><div>${i===0?'🌈 起點':TYPE[i]==='p'?'你的站點':TYPE[i]==='c'?'電腦站點':TYPE[i]==='item'?'🎁 道具':TYPE[i]==='chance'?'✨ 機會':'✉ 命運'}</div><div class="tokens">${s.pos===i?s.role:''}${s.cp===i?'☁️':''}</div><span>${i.toString().padStart(2,'0')}</span></div>`).join('')}<div class="center"><span class="pill">${state}</span><h2 style="margin-top:12px">${TOPICS[s.stage]}</h2><div class="dice" id="dice">${['⚀','⚁','⚂','⚃','⚄','⚅'][s.dice-1]}</div><p class="small">本階段目標：各 ${[3,3,4][s.stage]} 回合</p><button class="primary" id="roll" ${s.pending||s.question||busy?'disabled':''} onclick="roll()">擲骰子</button><p class="small">點數最低為 0，仍可繼續</p></div></div><div class="log" aria-live="polite">${s.logs.map(l=>`<div>${escape(l)}</div>`).join('')||'完成情境選擇，閱讀解說，再繼續前進。'}</div>`}
function openModal(html){let d=$('modal');d.innerHTML=html;if(!d.open)d.showModal();setTimeout(()=>d.querySelector('button')?.focus(),0)}function closeModal(){$('modal').close()}async function roll(){if(busy||s.pending||s.question||paused)return;busy=true;$('roll').disabled=true;for(let i=0;i<8;i++){s.dice=1+Math.floor(Math.random()*6);$('dice').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][s.dice-1];tone(300+i*40);await new Promise(r=>setTimeout(r,70))}busy=false;s.pending={type:'dice',value:s.dice};render()}
function showPending(){if(s.pending.type==='dice')openModal(`<span class="pill">骰子結果</span><h2>前進 ${s.pending.value} 格</h2><p>你有 ${s.cards[1]} 張重新擲骰卡。重擲後採用第二次結果。</p><div class="actions"><button class="primary" onclick="move()">確認移動</button><button ${!s.cards[1]||s.pending.rerolled?'disabled':''} onclick="reroll()">使用重新擲骰卡</button></div>`);else if(s.pending.type==='feedback')feedbackModal();else if(s.pending.type==='event')openModal(`<span class="pill">${s.pending.title}</span><h2>${s.pending.text}</h2><p>${s.pending.detail}</p><button class="primary" onclick="finishTurn()">繼續，輪到電腦</button>`)}
function reroll(){s.cards[1]--;s.dice=1+Math.floor(Math.random()*6);s.pending.value=s.dice;s.pending.rerolled=true;s.records.push({type:'item',item:'reroll',value:s.dice,round:s.round+1});render()}
function move(){closeModal();let d=s.pending.value;s.records.push({type:'roll',actor:'player',round:s.round+1,value:d});s.pending=null;s.pos=(s.pos+d)%20;let type=TYPE[s.pos];if(['p','c'].includes(type)){let t=Math.random()<.3?Math.floor(Math.random()*(s.stage+1)):s.stage;let q=shuffle(BANK[t])[0];s.question={id:q.id,topic:t,order:shuffle([0,1,2]),selected:null,hint:false}}else if(type==='item'){let k=Math.floor(Math.random()*3);s.cards[k]++;s.pending={type:'event',title:'道具補給',text:'獲得'+['免扣點卡','重新擲骰卡','答題提示卡'][k],detail:'道具可於適合的時機使用。'};s.records.push({type:'itemGain',item:k,round:s.round+1})}else{let chance=type==='chance';let delta=type==='start'?0:chance?5:-5;s.p=Math.max(0,s.p+delta);s.pending={type:'event',title:type==='start'?'回到起點':chance?'機會卡':'命運卡',text:type==='start'?'重新出發':chance?'你為重要的界線討論預留了時間':'行程需要調整',detail:type==='start'?'保持目前點數，繼續學習。':chance?'遊戲點數 ＋5。':'遊戲點數－5。這是隨機遊戲事件，不代表健康或學習評價。'};s.records.push({type:'event',position:s.pos,delta,round:s.round+1})}render()}
function showQuestion(){let q=BANK[s.question.topic].find(q=>q.id===s.question.id);openModal(`<span class="pill">情境任務 · ${TOPICS[s.question.topic]}</span><h2>${q.text}</h2><div class="options">${s.question.order.map((o,i)=>`<button class="${s.question.selected===o?'selected':''}" onclick="s.question.selected=${o};save();showQuestion()">${String.fromCharCode(65+i)}. ${q.options[o]}</button>`).join('')}</div>${s.question.hint?'<p class="notice">提示：優先考慮自願、界線、安全與尊重隱私。</p>':''}<div class="actions"><button class="primary" ${s.question.selected===null?'disabled':''} onclick="answerGame()">確認答案</button><button ${!s.cards[2]||s.question.hint?'disabled':''} onclick="s.cards[2]--;s.question.hint=true;s.records.push({type:'item',item:'hint',round:s.round+1});save();showQuestion()">提示卡（${s.cards[2]}）</button></div>`)}
function answerGame(){let q=s.question;s.pending={type:'feedback',id:q.id,topic:q.topic,selected:q.selected,delta:[10,5,-5][q.selected],hint:q.hint,shield:false};s.question=null;render()}function feedbackModal(){let p=s.pending,q=BANK[p.topic].find(q=>q.id===p.id);openModal(`<span class="pill">選擇與解說</span><h2>${p.delta>0?'+':''}${p.delta} 點</h2><p>你的選擇：${q.options[p.selected]}</p><p class="notice">${q.explain}</p><p class="small">較適切的選擇：${q.options[0]}</p>${p.shield?'<p>已使用免扣點卡，本次不扣點。</p>':''}<div class="actions">${p.delta<0?`<button ${!s.cards[0]||p.shield?'disabled':''} onclick="s.cards[0]--;s.pending.shield=true;s.records.push({type:'item',item:'shield',round:s.round+1});save();feedbackModal()">使用免扣點卡（${s.cards[0]}）</button>`:''}<button class="primary" onclick="finishTurn()">繼續，輪到電腦</button></div>`)}
function finishTurn(){closeModal();let p=s.pending;if(p?.type==='feedback'){let delta=p.shield?0:p.delta;s.p=Math.max(0,s.p+delta);s.records.push({type:'gameAnswer',round:s.round+1,id:p.id,topic:p.topic,option:p.selected,correct:p.selected===0,rawDelta:p.delta,actualDelta:delta,hint:p.hint,at:new Date().toISOString()});addLog(`你完成情境任務：${delta>=0?'+':''}${delta} 點`)}s.pending=null;s.round++;let dice=1+Math.floor(Math.random()*6);s.cp=(s.cp+dice)%20;let t=TYPE[s.cp],delta=0;if(['p','c'].includes(t)){let r=Math.random();delta=r<.6?10:r<.85?5:-5}else if(t==='chance')delta=5;else if(t==='fate')delta=-5;s.c=Math.max(0,s.c+delta);s.cr++;s.records.push({type:'computer',round:s.cr,dice,position:s.cp,delta});addLog(`電腦擲出 ${dice}，到達第 ${s.cp} 格，${delta>=0?'+':''}${delta} 點`);if(s.round===10)s.view='result';else if(s.round===LIMITS[s.stage]){s.stage++;s.view='lesson'}render()}
function pauseGame(){if(busy)return;paused=true;openModal('<h2>休息一下</h2><p>暫停期間不計入使用時間。</p><div class="actions"><button class="primary" onclick="paused=false;closeModal();render()">繼續遊戲</button><button onclick="exportProgress()">匯出進度</button><button onclick="paused=false;closeModal();s.view=\'lesson\';render()">回顧教材</button></div>')}
function results(){let a=s.records.filter(r=>r.type==='gameAnswer'),correct=a.filter(r=>r.correct).length;$('main').innerHTML=`<span class="pill">三階段旅程完成</span><h1>${s.p===s.c?'雙方平手':s.p>s.c?'你贏得這場棋盤遊戲！':'電腦贏得這場棋盤遊戲'}</h1><p>你的點數 ${s.p} · 電腦點數 ${s.c}。遊戲勝負與學習表現分開呈現。</p><table><tr><th>主題</th><th>通關分數</th><th>嘗試次數</th></tr>${TOPICS.map((t,i)=>{let rec=s.records.filter(r=>r.type==='quiz'&&r.stage===i&&r.attempt===s.attempts[i]);return `<tr><td>${t}</td><td>${rec.filter(r=>r.correct).length} / 5</td><td>${s.attempts[i]}</td></tr>`}).join('')}</table><p>遊戲最適切作答：${correct} / ${a.length} 題${a.length?'（'+Math.round(correct/a.length*100)+'%）':''}</p><p class="small">有效使用時間：教材 ${Math.round(s.time.lesson/60)} 分 · 測驗 ${Math.round(s.time.quiz/60)} 分 · 遊戲 ${Math.round(s.time.game/60)} 分</p><h2>提交學習結果</h2><p>先下載 JSON 結果檔，再開啟研究表單並上傳。Google 檔案上傳可能需要登入帳號。</p><div class="actions"><button class="primary" onclick="download(s,'Dr-rainbow-result.json')">下載完整結果 JSON</button><button onclick="csv()">下載作答 CSV</button><button onclick="openForm()">前往 Google 表單</button><button onclick="settings()">設定表單連結</button></div><p class="notice">${s.form?'已設定表單連結。開啟表單不代表已提交，請確認表單送出成功。':'尚未設定研究表單；目前可以下載結果檔。'}</p><div class="actions"><button onclick="if(confirm('請先匯出結果。確定重新開始？')){s=fresh();render()}">重新開始</button></div>`}
function download(data,name){let a=document.createElement('a');let u=URL.createObjectURL(new Blob([typeof data==='string'?data:JSON.stringify(data,null,2)],{type:typeof data==='string'?'text/csv;charset=utf-8':'application/json'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportProgress(){if(!s.name){alert('請先開始學習。');return}download(s,'Dr-rainbow-progress.json')}function csv(){let cols=['type','stage','topic','attempt','round','id','option','correct','rawDelta','actualDelta','hint','at'];const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('\ufeff'+cols.join(',')+'\r\n'+s.records.map(r=>cols.map(k=>cell(r[k])).join(',')).join('\r\n'),'Dr-rainbow-answers.csv')}
function validate(x){if(!x||x.version!==1||typeof x.name!=='string'||!x.name||!['lesson','quiz','quizResult','game','result'].includes(x.view)||!Number.isInteger(x.stage)||x.stage<0||x.stage>2||!Array.isArray(x.records)||!Array.isArray(x.cards)||x.cards.length!==3||!x.cards.every(n=>Number.isInteger(n)&&n>=0)||![x.p,x.c].every(n=>Number.isFinite(n)&&n>=0)||![x.pos,x.cp].every(n=>Number.isInteger(n)&&n>=0&&n<20)||![x.round,x.cr].every(n=>Number.isInteger(n)&&n>=0&&n<=10)||!Array.isArray(x.logs)||!Array.isArray(x.passed)||!Array.isArray(x.attempts)||!x.time)throw Error('格式不符');if(x.quiz&&(!Array.isArray(x.quiz.ids)||x.quiz.ids.some(id=>!BANK[x.stage].some(q=>q.id===id))))throw Error('題目版本不符');if(x.question&&!BANK[x.question.topic]?.some(q=>q.id===x.question.id))throw Error('題目不符');}
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>5e6)throw Error();let x=JSON.parse(await f.text());validate(x);if(s.name&&!confirm('匯入將取代目前進度，是否繼續？'))return;closeModal();s=x;busy=false;paused=false;render()}catch(e){alert('無法匯入：檔案損壞、格式或版本不相容。')}finally{$('file').value=''}};
function settings(){openModal(`<h2>聲音與研究表單</h2><div class="actions"><button onclick="sound=!sound;this.textContent='音效：'+(sound?'開':'關');tone()">音效：${sound?'開':'關'}</button><button onclick="music=!music;setMusic();this.textContent='音樂：'+(music?'開':'關')">音樂：${music?'開':'關'}</button></div><p><label for="form">Google 表單連結</label></p><input id="form" placeholder="https://docs.google.com/forms/..." value="${escape(s.form||'')}"><p class="small">可貼上 Google 表單填答或預填連結。欄位尚未建立，因此此版不自動帶入學習摘要。</p><div class="actions"><button class="primary" onclick="saveSettings()">儲存設定</button><button onclick="closeModal();if(s.view==='game')render()">關閉</button></div>`)}function saveSettings(){let v=$('form').value.trim();if(v){try{let u=new URL(v);if(u.protocol!=='https:'||!['docs.google.com','forms.gle'].includes(u.hostname))throw Error()}catch(e){alert('請輸入有效的 Google 表單 HTTPS 連結。');return}}s.form=v;save();closeModal();render()}function openForm(){if(!s.form){settings();return}try{let u=new URL(s.form);if(u.protocol!=='https:'||!['docs.google.com','forms.gle'].includes(u.hostname))throw Error();window.open(u.href,'_blank','noopener,noreferrer')}catch(e){alert('表單連結無效，請重新設定。')}}
$('modal').addEventListener('cancel',e=>{if(s.question||s.pending){e.preventDefault();return}paused=false});setInterval(()=>{if(s.name&&!paused&&!document.hidden){let key=s.view==='lesson'?'lesson':s.view==='quiz'?'quiz':s.view==='game'?'game':null;if(key)s.time[key]++;save()}},1000);window.addEventListener('beforeunload',e=>{if(s.name&&s.view!=='result'){e.preventDefault();e.returnValue=''}});document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
// 保留既有本機進度，首頁不先覆寫。
let stored=null;try{stored=localStorage.getItem('dr-rainbow-v1')}catch(e){}render();if(stored)try{localStorage.setItem('dr-rainbow-v1',stored)}catch(e){}
</script></html>
